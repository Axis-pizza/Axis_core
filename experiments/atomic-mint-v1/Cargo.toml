[package]
name = "axis-atomic-mint-v1-exp"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
sbf-integration = []

[workspace]
members = [
    "programs/direct-route",
    "programs/hyp-mint",
]

[dependencies]
base64 = "0.22"
bincode = "1.3.3"
litesvm = "0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-address-lookup-table-interface = { version = "3.0.1", features = ["bincode", "bytemuck"] }
solana-account = "3.4"
solana-address = "2.7"
solana-compute-budget-interface = "3.0.0"
solana-hash = "3.1.0"
solana-instruction = "=3.2.0"
solana-keypair = "3.1"
solana-message = "=3.1.0"
solana-pubkey = "4.1"
solana-transaction = { version = "3.1", features = ["verify"] }
